version: '3.8'

networks:
  news-network:
    driver: bridge

services:
  web:
    build: .
    container_name: news-web
    restart: always
    # Hardening: Chạy user non-root (ví dụ UID 1000)
    user: "1000:1000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - news-network
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: news-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - news-network

  prometheus:
    image: prom/prometheus:latest
    container_name: news-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - news-network

  grafana:
    image: grafana/grafana:latest
    container_name: news-grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - news-network

  loki:
    image: grafana/loki:latest
    container_name: news-loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - news-network

  promtail:
    image: grafana/promtail:latest
    container_name: news-promtail
    restart: always
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - news-network