{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4 border-0">
            <h3 class="fw-bold text-primary mb-4"><i class="bi bi-pencil-square"></i> Đăng Bài Viết Mới</h3>
            
            <form action="/writer/new" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tiêu đề bài viết</label>
                    <input type="text" name="title" class="form-control" required placeholder="Nhập tiêu đề bài viết..."
                           oninvalid="this.setCustomValidity('Vui lòng nhập tiêu đề bài viết!')" oninput="this.setCustomValidity('')">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Chuyên mục</label>
                    <select name="category" class="form-select">
                        <option value="thoisu">Thời sự</option>
                        <option value="congnghe">Công nghệ</option>
                        <option value="giaoduc">Giáo dục</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Tóm tắt bài viết</label>
                    <textarea name="summary" class="form-control" rows="2" required placeholder="Nhập mô tả ngắn cho bài viết..."
                              oninvalid="this.setCustomValidity('Vui lòng nhập tóm tắt bài viết!')" oninput="this.setCustomValidity('')"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nội dung chi tiết</label>
                    <textarea name="content" class="form-control" rows="8" required placeholder="Nhập toàn bộ nội dung bài viết..."
                              oninvalid="this.setCustomValidity('Vui lòng nhập nội dung chi tiết!')" oninput="this.setCustomValidity('')"></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-send"></i> Đăng Bài</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
