{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4 border-0">
            <h3 class="text-center fw-bold mb-4 text-success"><i class="bi bi-person-plus"></i> Đăng Ký Tài Khoản</h3>
            
            {% if error %}
            <div class="alert alert-danger py-2 text-center">
                <i class="bi bi-exclamation-octagon"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/auth/register" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên đăng nhập</label>
                    <input type="text" name="username" class="form-control" required placeholder="Tạo tên đăng nhập..."
                           oninvalid="this.setCustomValidity('Vui lòng tạo tên đăng nhập!')" oninput="this.setCustomValidity('')">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required placeholder="Tạo mật khẩu..."
                           oninvalid="this.setCustomValidity('Vui lòng tạo mật khẩu!')" oninput="this.setCustomValidity('')">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Đăng Ký Ngay</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">Đã có tài khoản? <a href="/auth/login" class="text-decoration-none fw-bold">Đăng nhập tại đây</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
